# TGM: UI tour on an Android emulator in CI (no emulator needed on anyone's PC).
# Logs in with a test account (secrets TGM_TEST_USER, TGM_TEST_APP_PASSWORD), opens every tab,
# times them and uploads screenshots as the artifact "ui-shots".
name: TGM UI test

on:
  workflow_run:
    workflows: ["TGM build"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  ui-tour:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check test account secrets
        env:
          U: ${{ secrets.TGM_TEST_USER }}
        run: |
          if [ -z "$U" ]; then echo "::warning::TGM_TEST_USER not set, skipping"; echo "SKIP=1" >> "$GITHUB_ENV"; fi

      - name: Download debug APK from build-main
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download build-main -R "$GITHUB_REPOSITORY" -p 'tgm-chat-debug-*.apk' -D apk

      - name: Enable KVM
        if: env.SKIP != '1'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run UI tour
        if: env.SKIP != '1'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TGM_TEST_USER: ${{ secrets.TGM_TEST_USER }}
          TGM_TEST_APP_PASSWORD: ${{ secrets.TGM_TEST_APP_PASSWORD }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r apk/*.apk
            python3 tgm/uitest/ui_tour.py

      - uses: actions/upload-artifact@v4
        if: always() && env.SKIP != '1'
        with:
          name: ui-shots
          path: ui-shots
          retention-days: 14
