# TGM Chat Android build.
# Builds the gplay flavor (debug APK always; signed release APK + AAB when signing secrets exist)
# and publishes the files to the pre-release "build-<branch>" so they can be downloaded without
# GitHub Actions artifact access.
name: TGM build

on:
  push:
    branches: [ main, "tgm/**" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tgm-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > google-services.json
            python3 tgm/apply-firebase.py google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON not set - push notifications will not work in this build"
          fi

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TGM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tgm.jks"
            echo "TGM_KEYSTORE_FILE=$RUNNER_TEMP/tgm.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::TGM_KEYSTORE_BASE64 not set - release build will be unsigned"
          fi

      - name: Build
        env:
          TGM_KEYSTORE_PASSWORD: ${{ secrets.TGM_KEYSTORE_PASSWORD }}
          TGM_KEY_ALIAS: ${{ secrets.TGM_KEY_ALIAS }}
          TGM_KEY_PASSWORD: ${{ secrets.TGM_KEY_PASSWORD }}
        run: |
          export TGM_VERSION_CODE=$((250100000 + GITHUB_RUN_NUMBER))
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          ./gradlew --no-daemon assembleGplay
          ./gradlew --no-daemon :app:bundleGplayRelease
          mkdir -p dist
          short=$(git rev-parse --short HEAD)
          cp app/build/outputs/apk/gplay/debug/*.apk   "dist/tgm-chat-debug-$short.apk"
          cp app/build/outputs/apk/gplay/release/*.apk "dist/tgm-chat-release-$short.apk"
          cp app/build/outputs/bundle/gplayRelease/*.aab "dist/tgm-chat-release-$short.aab"
          ls -la dist

      - name: Publish to pre-release build-<branch>
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_REF_NAME//\//-}"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" dist/* --prerelease --target "$GITHUB_SHA" \
            --title "TGM Chat Android $tag ($(git rev-parse --short HEAD))" \
            --notes "Built by run $GITHUB_RUN_NUMBER, versionCode $((250100000 + GITHUB_RUN_NUMBER))."
